  uploadCancel.addEventListener('click', () => {
    const sent = state.uploading && state.uploadSent;
    abortUpload();
    refreshControls();
    closeUploadPanel();
    attachBtn.focus();
    if (sent) {
      addPlainAgentMessage('Upload cancelled. The file had already been sent, so it may still appear on the chart.');
    }
  });
  fileInput.addEventListener('change', () => setUploadError(''));
  docChipRemove.addEventListener('click', () => { clearPendingDocument(); input.focus(); });
  uploadPanel.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !state.uploading) { closeUploadPanel(); attachBtn.focus(); }
  });

  // -------------------------------------------------------------- sending

  async function sendTurn(text) {
    const epoch = state.epoch;
    const patientId = state.patientId;
    const controller = new AbortController();
    let timedOut = false;
    const timer = setTimeout(() => { timedOut = true; controller.abort(); }, REQUEST_TIMEOUT_MS);

    state.inflight = controller;
    state.lastUserText = text;
    setBusy(true);
    addTypingIndicator();

    const retry = () => sendTurn(text);
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: controller.signal,
        body: JSON.stringify({
          message: text,
          patient_id: patientId,
          conversation_id: state.conversationId,
          uploaded_document_ref: state.pendingDocRef
        })
      });
      if (epoch !== state.epoch) return;

      if (res.status === 401) {
        removeTypingIndicator();
        showGate({ message: 'Your session has ended. Log in again to keep using the Co-Pilot.', login: true });
        return;
      }
      if (!res.ok) {
        removeTypingIndicator();
        addErrorMessage(`The Co-Pilot couldn’t answer (HTTP ${res.status}). Your question was not answered.`, retry);
        return;
      }

      const turn = parseChatResponse(await res.json());
      if (epoch !== state.epoch) return;
      if (turn.conversationId) state.conversationId = turn.conversationId;
      // The document rides along with exactly one answered question (the server contract for
      // uploaded_document_ref). A failed send keeps it, so a retry still carries it.
      clearPendingDocument();
      removeTypingIndicator();
      addAgentMessage(turn);
    } catch (err) {
      if (epoch !== state.epoch) return;
      removeTypingIndicator();
      addErrorMessage(timedOut
        ? `The Co-Pilot didn’t respond within ${REQUEST_TIMEOUT_MS / 1000} seconds. It may still be working on it; retrying sends the question again.`
        : 'Something went wrong reaching the Co-Pilot. Your question was not answered.', retry);
    } finally {
      clearTimeout(timer);
      if (epoch === state.epoch) {
        state.inflight = null;
        setBusy(false);
        if (state.patientId !== null) input.focus();
      }
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || state.patientId === null || state.busy) return;

    // The URL is the source of truth for which patient this page is about.
    // If it moved under us (history navigation), re-sync instead of sending
    // this message into the previous patient's conversation.
    if (currentUrlPatient() !== state.requestedPatient) {
      applyPatientFromUrl();
      return;
    }

    addUserMessage(text);
    input.value = '';
    sendTurn(text);
  });

  // ------------------------------------------------ conversation / patient

  // Discards everything tied to the current conversation. Bumping the epoch
  // orphans any in-flight request; aborting it also frees the connection.
  function resetConversation() {
    state.epoch += 1;
    thumbCache.clear();
    if (state.inflight) state.inflight.abort();
    state.inflight = null;
    state.conversationId = null;
    state.lastUserText = null;
    resetUploadUi();
    log.replaceChildren();
    closeCitationModal();
    setBusy(false);
  }

  function currentUrlPatient() {
    const value = new URLSearchParams(location.search).get('patient');
    return value && value.trim() ? value.trim() : null;
  }

  function renderPatientBar(mode, patient) {
    patientBar.replaceChildren();
    patientBar.className = 'patient-bar' + (mode === 'error' ? ' error' : '');
    patientBar.appendChild(el('span', 'label', 'Patient'));

    if (mode === 'loading') {
      patientBar.appendChild(el('span', 'pmeta', 'Loading patient details…'));
    } else if (mode === 'none') {
      patientBar.appendChild(el('span', 'pmeta', 'No patient selected'));
    } else if (mode === 'error') {
      const msg = el('span', 'pmeta', patient);
      msg.setAttribute('role', 'alert');
      patientBar.appendChild(msg);
      const retry = el('button', 'ghost', 'Retry');
      retry.type = 'button';
      retry.addEventListener('click', () => loadPatient(state.requestedPatient));
      patientBar.appendChild(retry);
    } else {
      patientBar.appendChild(el('span', 'pname', patient.name));
      const meta = [];
      if (patient.birthDate) meta.push('DOB ' + patient.birthDate);
      if (patient.gender) meta.push(patient.gender);
      if (meta.length) patientBar.appendChild(el('span', 'pmeta', meta.join(' · ')));
      patientBar.appendChild(el('span', 'pid', 'ID ' + patient.id));
    }
    patientBar.hidden = false;
  }

  function showNoPatient() {
    state.patientId = null;
    refreshControls();
    renderPatientBar('none');
    const bubble = el('div', 'bubble agent');
    bubble.appendChild(el('p', null,
      'Open this page with a patient in the address, e.g. /ui?patient=<patient id>, to start a conversation about that chart.'));
    const extras = [];
    if (!DEFAULT_PATIENT_ID.startsWith('__')) {
      const link = el('a', 'btn', 'Use the demo patient');
      link.href = '/ui?patient=' + encodeURIComponent(DEFAULT_PATIENT_ID);
      const wrap = el('div');
      wrap.appendChild(link);
      extras.push(wrap);
    }
    agentRow(bubble, extras);
  }

  async function loadPatient(requested) {
    const epoch = state.epoch;
    state.patientId = null;
    refreshControls();
    renderPatientBar('loading');

    const fail = (message) => {
      if (epoch === state.epoch) renderPatientBar('error', message);
    };

    let res;
    try {
      res = await fetch('/patient?patient_id=' + encodeURIComponent(requested));
    } catch (err) {
      fail('Couldn’t load patient details — chat is disabled until the patient is confirmed.');
      return;
    }
    if (epoch !== state.epoch) return;

    if (res.status === 401) {
      showGate({ message: 'Your session has ended. Log in again to keep using the Co-Pilot.', login: true });
      return;
    }
    if (res.status === 400 || res.status === 404) {
      fail(res.status === 400
        ? 'That isn’t a valid patient ID.'
        : 'No patient found for that ID, or you don’t have access to it.');
      return;
    }
    if (!res.ok) {
      fail('Couldn’t load patient details — chat is disabled until the patient is confirmed.');
      return;
    }

    let data;
    try {
      data = await res.json();
    } catch (err) {
      data = null;
    }
    if (epoch !== state.epoch) return;
    if (!data || typeof data.patient_id !== 'string' || typeof data.name !== 'string') {
      fail('Couldn’t read patient details — chat is disabled until the patient is confirmed.');
      return;
    }

    // From here on the canonical ID the server echoed is the only ID used.
    state.patientId = data.patient_id;
    renderPatientBar('loaded', {
      id: data.patient_id,
      name: data.name,
      birthDate: typeof data.birth_date === 'string' ? data.birth_date : null,
      gender: typeof data.gender === 'string' ? data.gender : null
    });
    addPlainAgentMessage(OPENING_MESSAGE);
    refreshControls();
    input.focus();
  }

  // Starts a fresh conversation whenever the patient in the URL differs from
  // the one the page last acted on, so a conversation_id can never carry
  // over from one patient to another.
  function applyPatientFromUrl() {
    resetConversation();
    const requested = currentUrlPatient();
    state.requestedPatient = requested;
    if (requested === null) {
      showNoPatient();
    } else {
      loadPatient(requested);
    }
  }

  function handleUrlChange() {
    if (!log.hidden && currentUrlPatient() !== state.requestedPatient) applyPatientFromUrl();
  }
  window.addEventListener('popstate', handleUrlChange);
  window.addEventListener('pageshow', handleUrlChange);

  newConvoBtn.addEventListener('click', function () {
    // Same patient, fresh conversation: re-verify the header too, so the
    // identity on screen is always one the server just confirmed.
    applyPatientFromUrl();
  });

  // ----------------------------------------------------------------- init

  async function init() {
    let res;
    try {
      res = await fetch('/me');
    } catch (err) {
      showGate({ message: 'Couldn’t reach the Co-Pilot server.', retry: true });
      return;
    }
    if (res.status === 401) {
      showGate({ message: 'Log in with your OpenEMR account to use the Co-Pilot.', login: true });
      return;
    }
    if (!res.ok) {
      showGate({ message: `The Co-Pilot server returned an error (HTTP ${res.status}).`, retry: true });
      return;
    }

    let me = null;
    try {
      me = await res.json();
    } catch (err) {
      me = null;
    }
    const resident = $('resident');
    resident.textContent = me && typeof me.resident === 'string' && me.resident
      ? 'Logged in as ' + me.resident
      : 'Logged in';
    resident.hidden = false;

    showChat();
    applyPatientFromUrl();
  }

  $('gate-retry').addEventListener('click', init);
  init();
})();
</script>

</body>
</html>
